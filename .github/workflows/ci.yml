name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm test
        env:
          # Confere os preços exibidos (lib/pricing.ts) com os price IDs do Stripe em modo teste.
          # Use uma chave restrita (rk_test_...) só com leitura de Prices. Sem o secret (ex.: PR de fork) o teste
          # é pulado; com o secret, REQUIRE_STRIPE_PRICES=1 faz faltar qualquer variável virar falha, não skip.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PRICE_MONTHLY: ${{ vars.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL: ${{ vars.STRIPE_PRICE_ANNUAL }}
          REQUIRE_STRIPE_PRICES: ${{ secrets.STRIPE_TEST_SECRET_KEY != '' && '1' || '' }}
      - run: npm run build
        env:
          # Placeholders: the build only needs these to exist, nothing connects.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder

  integration:
    # Banco compartilhado (branch de teste do Neon) e a suíte faz TRUNCATE: só uma execução por vez.
    # PRs de forks não recebem secrets, então o job é pulado nesse caso.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: integration-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar .env.test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Secret TEST_DATABASE_URL não configurado (URL da branch de teste do Neon)."
            exit 1
          fi
          echo "::add-mask::$TEST_DATABASE_URL"
          TEST_DB_HOST=$(node -e "console.log(new URL(process.env.TEST_DATABASE_URL).hostname)")
          {
            echo "DATABASE_URL=$TEST_DATABASE_URL"
            echo "TEST_DB_HOST=$TEST_DB_HOST"
            # Serviços externos são simulados nos testes: estes valores só precisam existir.
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
            echo "CLERK_SECRET_KEY=sk_test_placeholder"
            echo "CLERK_WEBHOOK_SIGNING_SECRET=whsec_dGVzdC1zZWNyZXQtZm9yLWNp"
            echo "TRIGGER_SECRET_KEY=tr_dev_placeholder"
            echo "STRIPE_SECRET_KEY=sk_test_placeholder"
            echo "STRIPE_WEBHOOK_SECRET=whsec_test_placeholder"
            echo "STRIPE_PRICE_MONTHLY=price_test_monthly"
            echo "STRIPE_PRICE_ANNUAL=price_test_annual"
            echo "TELEGRAM_BOT_TOKEN=123456:test-token"
            echo "TELEGRAM_BOT_USERNAME=iron_ai_test_bot"
            echo "TELEGRAM_WEBHOOK_SECRET=test-telegram-secret"
            echo "OPENAI_API_KEY=sk-test-placeholder"
          } > .env.test
      - run: npm run test:integration

  deploy-trigger:
    needs: [check, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-trigger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx trigger.dev@4.8.5 deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}