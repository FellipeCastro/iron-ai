services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: iron
      POSTGRES_PASSWORD: iron
      POSTGRES_DB: iron
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iron -d iron"]
      interval: 3s
      retries: 20

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iron:iron@db:5432/iron
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
